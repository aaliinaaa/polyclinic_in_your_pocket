{% extends "base.html" %}
{% block content %}
<h1>Панель администратора</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0;">
    <div style="background:#f8f9fa; padding:20px; border-radius:8px; text-align:center;">
        <h3>{{ doctors_count }}</h3>
        <p>Врачей в системе</p>
        <a href="{{ url_for('admin.manage_doctors') }}" class="btn" style="background:#007bff; color:white; padding:8px 15px; text-decoration:none; border-radius:4px;">Управлять</a>
    </div>
    <div style="background:#f8f9fa; padding:20px; border-radius:8px; text-align:center;">
        <h3>{{ patients_count }}</h3>
        <p>Пациентов</p>
    </div>
    <div style="background:#f8f9fa; padding:20px; border-radius:8px; text-align:center;">
        <h3>{{ logs_count }}</h3>
        <p>Записей в журнале</p>
        <a href="{{ url_for('admin.view_logs') }}" class="btn" style="background:#6c757d; color:white; padding:8px 15px; text-decoration:none; border-radius:4px;">Просмотреть</a>
    </div>
</div>
{% endblock %}
